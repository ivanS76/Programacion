<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calendario Mensual</title>
  <link rel="stylesheet" href="calendario_demo.css" />
</head>
<body>
  <div class="app-container">
    <div class="calendar-header">
      <button id="prev-btn" class="nav-arrow">&lt;</button>
      <div id="current-month-year"></div>
      <button id="next-btn" class="nav-arrow">&gt;</button>
      <button id="today-btn" class="btn-today">Hoy</button>
    </div>

    <div id="month-view" class="calendar-grid"></div>
  </div>

  <script src="calendario_demo.js"></script>
</body>
</html>
