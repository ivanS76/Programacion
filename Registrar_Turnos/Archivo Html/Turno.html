<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gestión de Turnos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../Estilo/EstiloTurno.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css" />
</head>
<body>

    <!-- Imagen decorativa de fondo -->
    <img src="../Imagen/20250619_1423_Diseño Diente HD_remix_01jy4kcaaefvq8v6hkfe7vbwbx.png" 
         alt="Fondo decorativo odontológico" 
         class="bg-decoracion" />

    <div class="container my-5">
        <div id="alertaTurno" class="alert d-none" role="alert" aria-live="polite"></div>

        <div class="card shadow-lg p-4">
            <h2 class="text-center text-primary mb-4">Gestión de Turnos</h2>

            <form id="formTurno" novalidate>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="turnoDNI" class="form-label">DNI del Paciente</label>
                        <input type="text" id="turnoDNI" class="form-control" required />
                    </div>
                    <div class="col-md-6">
                        <label for="turnoPaciente" class="form-label">Nombre del Paciente</label>
                        <input type="text" id="turnoPaciente" class="form-control" required />
                    </div>
                    <div class="col-md-6">
                        <label for="turnoFecha" class="form-label">Fecha del Turno</label>
                        <input type="date" id="turnoFecha" class="form-control" required min="2025-01-01" />
                    </div>
                    <div class="col-md-6">
                        <label for="turnoHora" class="form-label">Hora del Turno</label>
                        <select id="turnoHora" class="form-select" required>
                            <option value="">Seleccionar hora</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="turnoEstado" class="form-label">Estado del Turno</label>
                        <select id="turnoEstado" class="form-select" required>
                            <option value="">Seleccionar</option>
                            <option value="Pendiente">Pendiente</option>
                            <option value="Confirmado">Confirmado</option>
                            <option value="Cancelado">Cancelado</option>
                        </select>
                    </div>
                </div>

                <div class="botones-turno">
                    <input type="submit" class="btn btn-primary" value="Guardar" />
                    <input type="reset" id="btnLimpiar" class="btn btn-secondary" value="Limpiar campos" title="Limpiar formulario" />
                </div>
            </form>
        </div>

        <div class="card mt-5 shadow">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">Listado de Turnos</h5>
            </div>
            <div class="table-responsive">
                <table class="table table-bordered table-hover table-sm align-middle text-center mb-0" id="storeList">
                    <thead class="table-light">
                        <tr>
                            <th>DNI</th>
                            <th>Nombre</th>
                            <th>Fecha</th>
                            <th>Hora</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Filas dinámicas -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal de confirmación -->
    <div id="modalConfirmacion" class="modal fade" tabindex="-1" aria-labelledby="modalConfirmacionLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalConfirmacionLabel">Confirmación</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    ¿Deseas eliminar este turno?
                </div>
                <div class="modal-footer">
                    <button id="btnCancelar" type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button id="btnAceptar" type="button" class="btn btn-danger">Eliminar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
    <script src="../JavaScript/TurnoLogica.js"></script>
</body>
</html>
