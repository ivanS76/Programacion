<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-image: url("../img/182106118-medical-frame-with-dental-equipment-icons-dentistry-and-health-care-background-dentistry-items.jpg"); 
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .register-container {
      max-width: 400px;
      width: 100%;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    .register-image {
      width: 100px;
      display: block;
      margin: 0 auto 20px;
    }
    @media (max-width: 500px) {
      .login-container {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="register-container">
    
    <img src="../img/155931276-dentistry-and-healthcare-concept-white-healthy-teeth-professional-dental-care-vector-flat-cartoon.jpg"  alt="Logo" class="register-image">

    <h4 class="text-center">Registro</h4>
    <form id="registerForm">
      <div class="mb-3">
        <label for="email" class="form-label">Correo electrónico</label>
        <input type="email" class="form-control" id="email" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="password" required>
      </div>
      <button type="submit" class="btn btn-success w-100">Crear cuenta</button>
    </form>
    <p class="mt-3 text-center">
      ¿Ya tienes cuenta? <a href="../html/login.html">Inicia sesión</a>
    </p>
  </div>

  <script src="../js/auth.js"></script>
</body>
</html>
