<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turnos del Día</title>
    <link rel="stylesheet" href="../style/calendario_demo.css" />
</head>
<body>
    <nav class="navbar">
    <ul>
        <li><a href="calendario_mes.html">Inicio</a></li>
        <li><a href="#">Pacientes</a></li>
        <li><a href="/Programacion/Cajas/caja.html">Caja</a></li>
        <li><a href="/Programacion/Registrar_Turnos/Archivo Html/Turno.html">Registrar Turnos</a></li>
    </ul>
</nav>

    <div class="app-container">
        <div class="calendar-header">
            <div class="calendar-title" id="current-day-title">Día</div>
            <div>
                <button class="btn-today" onclick="cambiarDia(-1)">←</button>
                <button class="btn-today" onclick="volver()">Volver al mes</button>
                <button class="btn-today" onclick="cambiarDia(1)">→</button>
            </div>
        </div>

        <div class="calendar-grid-dia" id="day-view"></div>
    </div>

    <!-- Modal para agregar/editar turno -->
    <div id="turnoModal" class="modal">
        <div class="modal-content">
            <h3 id="modal-title">Nuevo Turno</h3>
            <form id="turnoForm">
                <label>Fecha</label>
                <input type="date" id="fecha" required />
                <label>Hora inicio</label>
                <input type="time" id="hora_inicio" required />
                <label>Hora fin</label>
                <input type="time" id="hora_fin" required />
                <label>Descripción</label>
                <textarea id="descripcion" required></textarea>
                <input type="hidden" id="turno_id" />
                <div class="modal-buttons">
                    <button type="submit" class="save-btn">Guardar</button>
                    <button type="button" id="eliminarTurnoBtn" class="delete-btn" style="display:none;">Eliminar</button>
                    <button type="button" id="cancelarBtn" class="cancel-btn">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal de confirmación de eliminación -->
    <div id="confirmDeleteModal" class="modal">
        <div class="modal-content">
            <h3>Confirmar eliminación</h3>
            <p>¿Estás seguro que quieres eliminar este turno?</p>
            <div class="modal-buttons">
                <button id="confirmDeleteBtn" class="delete-btn">Sí, eliminar</button>
                <button id="cancelDeleteBtn" class="cancel-btn">Cancelar</button>
            </div>
        </div>
    </div>

    <script src="../js/calendario_dia.js"></script>
</body>
</html>
