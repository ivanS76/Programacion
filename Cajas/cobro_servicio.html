<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cobro de servicios</title>
</head>
<body>
    <header>
        <h2> Cobro de Servicios</h2>
    </header>
    <nav>
        <a href="apertura.html">Volver</a>
    </nav>
    <div class="contenedor">
        <div class="caja_form ">
            <form id="formTurno">
                <div >
                    <div >
                        <label for="Fecha" class="form-label">Fecha de apertura</label>
                        <input type="date" id="fechaApertura" class="form-control" required />
                    </div>
                    <div >
                        <label for="Hora" class="form-label">Hora de apertura</label>
                        <input type="time" id="horaApertura" class="form-control" required />
                    </div>
                    <div class="">
                        <label for="Monto" class="form-label">Monto inicial</label>
                        <input id="montoApertura"type="number" placeholder="$0,00">
                    </div>
                </div>
                <div class="d-flex justify-content-center gap-3 mt-4">
                    <input type="submit" class="btn btn-primary px-4" value="Guardar" />
                    <a >Finalizar</a>
                </div>
            </form>

        </div>


    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>

</body>
</html>
