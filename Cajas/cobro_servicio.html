<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cobro de servicios</title>
</head>
<body>
   
    <div class="contenedor">
        <div class="caja_form ">
            <form id="formCobro">
                <header>
                    <h2> Cobro de Servicios</h2>
                </header>
                <nav>
                    <a class="volver" href="apertura.html">Volver</a>
                </nav>
                <div >
                    <div class="">
                        <label for="nombre" class="form-label">Nombre de paciente</label>
                        <input id="NombrePaciente"type="text">
                    </div>
                    <div class="">
                        <label for="apellido" class="form-label">apellido de paciente</label>
                        <input id="apellidoPaciente" type="text">
                    </div>
                    <div class="">
                        <label for="Monto" class="form-label">Monto a cobrar</label>
                        <input id="montoCobro"type="number" placeholder="$0,00">
                    </div>


                </div>
                <div class="d-flex justify-content-center gap-3 mt-4">
                    <input id="cobrar" type="button" class="btn btn-primary px-4" value="Guardar"/>
                    <a class="btnFinalizar" href="caja.html">Finalizar</a>
                </div>
            </form>


        </div>




    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="static/alerta_cobrar.js"></script>
</body>
</html>
