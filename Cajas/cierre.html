<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cierre</title>
</head>
<body>
   
    <div class="contenedor">
        <div class="caja_form ">
            <form id="formCierre">
                <header>
                    <h2> Cierre de Caja</h2>
                </header>
                <nav>
                    <a class="volver" href="caja.html">Volver</a>
                </nav>
                <div >
                    <div>
                        <label for="Fecha" class="form-label">Fecha de cierre</label>
                        <input type="date" id="fechaCierre" class="form-control" required />
                    </div>
                    <div >
                        <label for="Hora" class="form-label">Hora de Cierre</label>
                        <input type="time" id="horaCierre" class="form-control" required />
                    </div>
                     <div>
                        <label for="Monto" class="form-label">Servicios cobrados</label>
                        <input id="serviciosCobrados"type="number">
                    </div>
                    <div>
                        <label for="Monto" class="form-label">Monto Total</label>
                        <input id="montoCierre"type="number" placeholder="$0,00">
                    </div>
                </div>
                <div class="d-flex justify-content-center gap-3 mt-4">
                    <input id="cerrar" type="button" class="btn btn-primary px-4" value="Guardar"/>
                    <a class="btnFinalalizar" href="caja.html">Finalizar</a>
                </div>
            </form>


        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="static/alerta_cerrar.js"></script>
</body>


</html>
